name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: sonar/backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -f Sonar/Dockerfile \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            AWS_REGION=${{ secrets.AWS_REGION }}
            ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
            ECR_REPOSITORY=sonar/backend
            IMAGE_TAG=${{ env.IMAGE_TAG }}

            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull new image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Stop and remove old container
            docker stop sonar-app || true
            docker rm sonar-app || true

            # Run with docker-compose network
            docker run -d --name sonar-app \
              --network sonar_default \
              -p 8080:8080 \
              -v /opt/sonar/uploads:/app/wwwroot/uploads \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://+:8080 \
              -e ConnectionStrings__SonarContext='Host=sonar-db;Port=5432;Database=sonardb;Username=sonaruser;Password=SonarPass2025!' \
              -e Analytics__GrpcUrl='http://sonar-analytics:5000' \
              -e "FrontEnd-Url=${{ secrets.FRONTEND_URL }}" \
              -e Jwt__Key='${{ secrets.JWT_KEY }}' \
              -e Jwt__Issuer='${{ secrets.JWT_ISSUER }}' \
              -e Jwt__Audience='${{ secrets.JWT_AUDIENCE }}' \
              -e Smtp__Host='${{ vars.SMTP_HOST }}' \
              -e Smtp__Port='${{ vars.SMTP_PORT }}' \
              -e Smtp__From='${{ vars.SMTP_FROM }}' \
              -e Smtp__FromName='${{ vars.SMTP_FROM_NAME }}' \
              -e Smtp__Username='${{ secrets.SMTP_USERNAME }}' \
              -e Smtp__Password='${{ secrets.SMTP_PASSWORD }}' \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Cleanup old images
            docker image prune -af --filter "until=24h" || true
